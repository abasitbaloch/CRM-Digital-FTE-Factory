apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-success-config
  namespace: customer-success
  labels:
    app: customer-success
data:
  # Database configuration
  DB_HOST: "postgres-service.customer-success.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "customer_success"
  DB_USER: "postgres"

  # Kafka configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.customer-success.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP: "message-processor"

  # Kafka topics
  TOPIC_CUSTOMER_MESSAGES: "customer-messages"
  TOPIC_AGENT_METRICS: "agent-metrics"
  TOPIC_ESCALATIONS: "escalations"

  # Agent configuration
  AGENT_MODEL: "gpt-4-turbo-preview"
  AGENT_VERSION: "1.0.0"

  # API configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  CORS_ORIGINS: "*"

  # Channel configuration
  TWILIO_WHATSAPP_NUMBER: "whatsapp:+14155238886"

  # Logging
  LOG_LEVEL: "INFO"

  # Feature flags
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "false"
