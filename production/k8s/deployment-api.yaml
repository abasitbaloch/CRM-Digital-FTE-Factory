apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-success-api
  namespace: customer-success
  labels:
    app: customer-success
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: customer-success
      component: api
  template:
    metadata:
      labels:
        app: customer-success
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: customer-success-api
      containers:
      - name: api
        image: customer-success/api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        # Load from ConfigMap
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: customer-success-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: customer-success-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: customer-success-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: customer-success-config
              key: DB_USER
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: customer-success-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: AGENT_MODEL
          valueFrom:
            configMapKeyRef:
              name: customer-success-config
              key: AGENT_MODEL
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: customer-success-config
              key: CORS_ORIGINS
        - name: TWILIO_WHATSAPP_NUMBER
          valueFrom:
            configMapKeyRef:
              name: customer-success-config
              key: TWILIO_WHATSAPP_NUMBER

        # Load from Secrets
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: customer-success-secrets
              key: DB_PASSWORD
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: customer-success-secrets
              key: OPENAI_API_KEY
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: customer-success-secrets
              key: TWILIO_ACCOUNT_SID
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: customer-success-secrets
              key: TWILIO_AUTH_TOKEN
        - name: GMAIL_DELEGATED_EMAIL
          valueFrom:
            secretKeyRef:
              name: customer-success-secrets
              key: GMAIL_DELEGATED_EMAIL

        # Volume mounts for Gmail service account
        volumeMounts:
        - name: gmail-credentials
          mountPath: /secrets
          readOnly: true

        # Resource limits
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Startup probe for slow starts
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30

      volumes:
      - name: gmail-credentials
        secret:
          secretName: gmail-service-account

      # Pod scheduling
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-success-api
  namespace: customer-success
  labels:
    app: customer-success
    component: api
