# Kubernetes Deployment - Customer Success AI Agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-success-agent
  labels:
    app: customer-success-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: customer-success-agent
  template:
    metadata:
      labels:
        app: customer-success-agent
    spec:
      containers:
      - name: api
        image: customer-success-agent:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: agent-secrets
              key: redis-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
