apiVersion: v1
kind: Secret
metadata:
  name: customer-success-secrets
  namespace: customer-success
  labels:
    app: customer-success
type: Opaque
stringData:
  # Database credentials
  DB_PASSWORD: "your-postgres-password-here"

  # OpenAI API key
  OPENAI_API_KEY: "sk-your-openai-api-key-here"

  # Twilio credentials
  TWILIO_ACCOUNT_SID: "your-twilio-account-sid"
  TWILIO_AUTH_TOKEN: "your-twilio-auth-token"

  # Gmail service account (base64 encoded JSON)
  GMAIL_SERVICE_ACCOUNT_FILE: "/secrets/gmail-service-account.json"
  GMAIL_DELEGATED_EMAIL: "support@example.com"

  # JWT secret for API authentication (if needed)
  JWT_SECRET: "your-jwt-secret-key-here"

  # Encryption key for sensitive data
  ENCRYPTION_KEY: "your-encryption-key-here"

---
apiVersion: v1
kind: Secret
metadata:
  name: gmail-service-account
  namespace: customer-success
  labels:
    app: customer-success
type: Opaque
data:
  # Gmail service account JSON (base64 encoded)
  # Replace with: cat service-account.json | base64 -w 0
  gmail-service-account.json: ""
